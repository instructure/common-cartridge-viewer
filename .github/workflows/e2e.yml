name: E2E Tests

on:
  pull_request:
    branches:
      - master
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed env URL to test against"
        required: false
        default: "https://common-cartridge-viewer-edge.netlify.app"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-merge:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    env:
      PW_BLOB: ${{ github.job }}-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (build)
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Setup Node (Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright (local build, ${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-${{ github.job }}-${{ matrix.browser }}
          path: blob-report/
          if-no-files-found: ignore

  deployed:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    env:
      CCV_BASE_URL: ${{ inputs.base_url || 'https://common-cartridge-viewer-edge.netlify.app' }}
      PW_BLOB: ${{ github.job }}-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (install)
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Node (Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright (edge deploy, ${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-${{ github.job }}-${{ matrix.browser }}
          path: blob-report/
          if-no-files-found: ignore

  report:
    if: always()
    needs: [pre-merge, deployed]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (install)
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Node (Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into HTML + JSON
        run: npx playwright merge-reports --config merge.config.ts ./all-blob-reports

      - name: Upload merged HTML report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Publish test summary
        if: always()
        run: node scripts/report-summary.js
